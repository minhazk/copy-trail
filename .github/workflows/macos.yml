name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test clipboard behavior
        run: swift test
      - name: Build application bundle
        run: scripts/build-app.sh
