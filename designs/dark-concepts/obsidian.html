<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.widget,.widget button,.widget input{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{cursor:pointer} .concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(304px,1fr));gap:24px;align-items:start}.concept{min-width:0}.caption{padding:2px 0 14px;font-size:13px;font-weight:500;color:#aaa;letter-spacing:.3px}.caption span{display:block;margin-top:6px;font-size:11px;color:#777;font-weight:400;letter-spacing:0}.widget{height:480px;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:14px 10px 10px;overflow:hidden;box-shadow:0 16px 40px #0003;color:var(--fg);--panel:#080808;--row:#141414;--line:#292929;--fg:#e9e9e9;--muted:#858585;--search:#111;--radius:9px}.widget.graphite{--panel:#191919;--row:#252525;--line:#383838;--fg:#eee;--muted:#999;--search:#222;--radius:12px;border-radius:24px}.widget.slate{--panel:#121518;--row:#202428;--line:#32363a;--fg:#eceeef;--muted:#8e959b;--search:#1a1e22;--radius:8px;border-radius:16px}.search{height:40px;margin:0 4px 13px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--search);color:var(--muted)}.search input{width:100%;min-width:0;border:0;outline:0;background:none;color:var(--fg);font:400 12px Arial,Helvetica,sans-serif}.search input::placeholder{color:var(--muted)}.search .more{border:0;background:none;color:var(--muted);padding:0;font-size:18px;line-height:1}.lens{width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;position:relative;flex-shrink:0}.lens:after{content:"";position:absolute;width:5px;height:1.5px;background:currentColor;transform:rotate(45deg);right:-4px;bottom:-2px}.row{min-height:68px;position:relative;border-radius:var(--radius);margin-bottom:4px;transition:background .18s;cursor:pointer}.row:after{content:"";position:absolute;bottom:-2px;left:12px;right:12px;height:1px;background:var(--line)}.row:last-child:after{display:none}.row:hover,.row.preview-hover{background:var(--row)}.widget button.copy{width:100%;min-height:68px;display:block;padding:15px 46px 15px 12px;border:0;background:none;text-align:left;line-height:1.6;color:var(--fg);font:400 13px/1.6 Arial,Helvetica,sans-serif;border-radius:inherit}.copy:focus-visible{outline:1px solid #777;outline-offset:-1px}.remove{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);width:26px;height:26px;font-size:21px;line-height:1;font-weight:300;opacity:0;transition:opacity .18s,color .18s}.row:hover .remove,.row.preview-hover .remove,.row:focus-within .remove{opacity:1}.remove:hover,.preview-hover .remove{color:#f25757}.graphite .row{background:#1d1d1d;border:1px solid #2c2c2c;margin-bottom:7px}.graphite .row:after{display:none}.graphite .row:hover,.graphite .row.preview-hover{background:var(--row);border-color:#454545}.graphite .search{border-radius:13px;background:#111;border-color:#303030;margin-bottom:12px}.slate .search{border:0;box-shadow:inset 0 0 0 1px #303438;border-radius:8px}.slate .row.preview-hover,.slate .row:hover{box-shadow:inset 2px 0 #777d83}.slate .row{border-radius:8px}.long .copy{padding-bottom:5px}.expand{position:relative;margin:0 0 10px 12px;font-size:10px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}.expand:after{content:"";display:inline-block;width:4px;height:4px;margin:0 0 2px 6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg)}.expanded .expand:after{transform:rotate(225deg);margin-bottom:0}.textbody{display:block;max-height:42px;overflow:hidden}.row.expanded .expand:after{content:"";display:inline-block;width:4px;height:4px;margin:0 0 2px 6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg)}.expanded .expand:after{transform:rotate(225deg);margin-bottom:0}.textbody{-webkit-line-clamp:unset}.image-row .copy{padding-top:10px;padding-bottom:10px}.art{height:84px;width:150px;border-radius:6px;overflow:hidden;position:relative;background:linear-gradient(145deg,#b4b5b5,#53565a 60%,#282a2d)}.art:before{content:"";position:absolute;inset:15px 20px -10px 40px;background:linear-gradient(135deg,#e3e3e3,#747779);transform:skew(-25deg) rotate(-12deg);box-shadow:18px 18px 30px #0006}.art:after{content:"";position:absolute;inset:37px 47px -10px 13px;background:linear-gradient(135deg,#66696d,#17191c);transform:skew(-25deg) rotate(-12deg)}.graphite .art{background:linear-gradient(140deg,#b0aaa1,#49453f)}.slate .art{background:linear-gradient(140deg,#8f9eac,#343b42)}.demo-status{min-height:18px;font-size:11px;color:#999;padding:10px 2px 0}.single{width:336px}.single .caption{padding-top:6px}.single .demo-status{display:none}@media(max-width:650px){.concepts{grid-template-columns:1fr}.concept{max-width:336px;width:100%;margin:auto}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><section class="single"><div class="caption">Obsidian<span>Near-black · crisp separators · quiet chrome</span></div><div class="widget obsidian"><div class="search"><span class="lens" aria-hidden="true"></span><input aria-label="Search clipboard" placeholder="Search clipboard…"><button class="more" aria-label="More options">···</button></div><div class="rows"><div class="row preview-hover"><button class="copy">lightlyops.com</button><button class="remove" aria-label="Remove saved item">×</button></div><div class="row"><button class="copy">Make room for good ideas.</button><button class="remove" aria-label="Remove saved item">×</button></div><div class="row long"><button class="copy"><span class="textbody">The details make the difference. Keep the experience simple, considered and easy to return to. A useful tool should feel effortless every time you open it.</span></button><button class="expand">Expand</button><button class="remove" aria-label="Remove saved item">×</button></div><div class="row image-row"><button class="copy" aria-label="Copy image"><div class="art" role="img" aria-label="Monochrome architectural image"></div></button><button class="remove" aria-label="Remove saved item">×</button></div></div></div></section><div id="status" class="demo-status"></div><script>document.querySelectorAll('.widget').forEach(widget=>{widget.querySelector('input').addEventListener('input',event=>{widget.querySelectorAll('.row').forEach(row=>{row.hidden=!row.textContent.toLowerCase().includes(event.target.value.toLowerCase())})});widget.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',()=>{const row=button.closest('.row');widget.querySelectorAll('.preview-hover').forEach(x=>x.classList.remove('preview-hover'));row.classList.add('preview-hover');widget.querySelector('.rows').prepend(row);document.getElementById('status').textContent='Preview: item moved to the top.'}));widget.querySelectorAll('.remove').forEach(button=>button.addEventListener('click',()=>button.closest('.row').remove()));widget.querySelectorAll('.expand').forEach(button=>button.addEventListener('click',()=>{const expanded=button.closest('.row').classList.toggle('expanded');button.textContent=expanded?'Show less':'Expand'}));widget.querySelector('.more').addEventListener('click',()=>{document.getElementById('status').textContent='Design preview — your clipboard is unchanged.'})});</script></body></html>
